<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e64c8">
<title>Work Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#f4f6fa; --fg:#1b2330; --card:#fff; --accent:#1e64c8; --stop:#d33a3a; --muted:#6b7686; --line:#e1e5ec; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --fg:#e8ecf3; --card:#1c222c; --muted:#93a0b3; --line:#2b3340; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px system-ui,sans-serif; padding:16px; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:16px; }
  #timer { font-size:3rem; text-align:center; font-variant-numeric:tabular-nums; margin:8px 0 16px; }
  button { font:inherit; border:0; border-radius:10px; padding:14px; background:var(--accent); color:#fff; cursor:pointer; }
  #startStop { width:100%; font-size:1.3rem; }
  #startStop.running { background:var(--stop); }
  button.small { padding:6px 10px; background:transparent; color:var(--muted); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  input, select { font:inherit; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); min-width:0; }
  input[type=month] { flex:1; }
  .entry { display:flex; justify-content:space-between; gap:8px; padding:10px 0; border-top:1px solid var(--line); }
  .entry:first-child { border-top:0; }
  .entry small { color:var(--muted); display:block; }
  .day { font-weight:600; margin-top:10px; }
  dialog { border:0; border-radius:14px; padding:20px; width:min(92vw,420px); background:var(--card); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog input { width:100%; margin:10px 0; }
  #msg { color:var(--muted); min-height:1.2em; margin:8px 0 0; }
</style>
</head>
<body>
<h1>Work Tracker</h1>

<div class="card">
  <div id="timer">0:00:00</div>
  <button id="startStop">Start</button>
</div>

<div class="card">
  <div class="row">
    <input type="month" id="month">
    <button id="export">Export invoice</button>
  </div>
  <div class="row" style="margin-top:12px">
    <label for="rate" style="flex:1">Pay per hour ($)</label>
    <input type="number" id="rate" min="0" step="0.01" inputmode="decimal" style="width:110px">
  </div>
  <p id="msg"></p>
  <div id="summary" class="day"></div>
  <div id="list"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <strong id="dlgTitle">What did you do?</strong>
    <div id="dlgTime" style="color:var(--muted)"></div>
    <input id="note" placeholder="e.g. Mowing, painting" autocomplete="off" required>
    <div class="row">
      <button type="button" class="small" id="discard">Discard</button>
      <button style="flex:1" value="save">Save</button>
    </div>
  </form>
</dialog>

<script src="xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
